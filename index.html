<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Local-first habit tracker featuring 4 AM rollover, momentum scoring, consistency heatmaps, and zero latency." />
    <meta name="theme-color" content="#09090b" id="theme-color-meta" />
    <title>Habit Tracker — Local-First Consistency & Streaks</title>

    <!-- Synchronous anti-FOUC theme detector -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = stored === 'dark' || (!stored && prefersDark) || (stored === 'system' && prefersDark);
          if (isDark) {
            document.documentElement.classList.add('dark');
            var meta = document.getElementById('theme-color-meta');
            if (meta) meta.setAttribute('content', '#09090b');
          } else {
            document.documentElement.classList.remove('dark');
            var meta = document.getElementById('theme-color-meta');
            if (meta) meta.setAttribute('content', '#ffffff');
          }
        } catch (e) {}
      })();
    </script>

    <style>
      :root {
        --splash-bg: #ffffff;
        --splash-fg: #09090b;
        --splash-muted: #71717a;
        --splash-border: rgba(0, 0, 0, 0.08);
        --splash-bar-bg: #f4f4f5;
        --splash-bar-fill: #18181b;
      }
      html.dark {
        --splash-bg: #09090b;
        --splash-fg: #f4f4f5;
        --splash-muted: #a1a1aa;
        --splash-border: rgba(255, 255, 255, 0.1);
        --splash-bar-bg: #27272a;
        --splash-bar-fill: #fafafa;
      }
      html, body {
        margin: 0;
        padding: 0;
        background-color: var(--splash-bg);
        color: var(--splash-fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      #splash-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        width: 100%;
        background-color: var(--splash-bg);
        color: var(--splash-fg);
      }
      .splash-icon-box {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background: rgba(161, 161, 170, 0.08);
        border: 1px solid var(--splash-border);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 16px;
        animation: splash-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      .splash-icon-box svg {
        color: #f59e0b;
        fill: #f59e0b;
      }
      .splash-title {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.025em;
        margin-bottom: 4px;
      }
      .splash-subtitle {
        font-size: 12px;
        color: var(--splash-muted);
        margin-bottom: 24px;
      }
      .splash-bar-bg {
        width: 128px;
        height: 4px;
        border-radius: 9999px;
        background-color: var(--splash-bar-bg);
        overflow: hidden;
        position: relative;
      }
      .splash-bar-fill {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 40%;
        background-color: var(--splash-bar-fill);
        border-radius: 9999px;
        animation: splash-bar-anim 1.4s ease-in-out infinite;
      }
      @keyframes splash-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(0.96); opacity: 0.8; }
      }
      @keyframes splash-bar-anim {
        0% { left: -40%; width: 40%; }
        50% { left: 35%; width: 50%; }
        100% { left: 100%; width: 30%; }
      }
    </style>
  </head>
  <body class="bg-background text-foreground antialiased min-h-screen">
    <div id="root">
      <div id="splash-container">
        <div class="splash-icon-box">
          <svg width="24" height="24" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path>
          </svg>
        </div>
        <div class="splash-title">Habit Tracker</div>
        <div class="splash-subtitle">Loading your habits...</div>
        <div class="splash-bar-bg">
          <div class="splash-bar-fill"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
